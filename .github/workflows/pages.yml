# Publishes the www/ folder, and nothing else, to GitHub Pages.
# Needs Settings → Pages → Build and deployment → Source: GitHub Actions.
# The custom domain (crackthe.xyz) is set in those settings; no CNAME file is used.
name: Publish www to Pages

on:
  push:
    branches: [master]
    paths: ["www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
