<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crack the Code!</title>
<link rel="icon" id="ico-svg" href="favicon.svg" type="image/svg+xml">
<link rel="icon" id="ico-ico" href="favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" id="ico-apple" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Crack the Code!">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout idea: a bare white page from a logic workbook. Ink, two hairlines, and blue only where the game is pointing at something. */
:root{
  --paper:#ffffff; --ink:#111418; --muted:#8d949e; --faint:#cfd4db;
  --accent:#1d4ed8; --accent-ink:#ffffff; --hl:#d9e5ff; --true:#0b6e55; --false:#b02a1f; --contra:#fde3df;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1216; --ink:#e9edf2; --muted:#727b87; --faint:#39414c;
    --accent:#8fb0ff; --accent-ink:#0f1216; --hl:#1e3465; --true:#57d3ab; --false:#ff8f84; --contra:#4a211d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1216; --ink:#e9edf2; --muted:#727b87; --faint:#39414c;
  --accent:#8fb0ff; --accent-ink:#0f1216; --hl:#1e3465; --true:#57d3ab; --false:#ff8f84; --contra:#4a211d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.top h1{font-family:var(--math);font-style:italic;font-weight:600;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;align-items:center;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.meta select{background:var(--paper);border:none;padding:0;color:var(--ink)}
.tools{display:flex;gap:14px;margin-left:auto}
.ghost{padding:2px 0;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--accent)}

.board{font-family:var(--math);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(3,minmax(28px,.9fr)) repeat(var(--n),minmax(28px,1fr)) 74px;align-items:center}
.row>.c{text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.row>.c:nth-child(3){border-right:1px solid var(--ink)}
.head{border-bottom:1px solid var(--ink)}
.head .c{font-style:italic;font-weight:600;font-size:17px}
.hist.guess .c.d{font-weight:600}
.dag{position:absolute;left:calc(50% + 7px);top:1px;font-size:13px;color:var(--muted)}
.r{font-weight:600;font-size:19px;border-radius:4px;padding:0 6px;line-height:1.35}
.r.t{color:var(--true)} .r.f{color:var(--false)}
.r.echo{background:var(--hl)}
.r.contra{background:var(--contra)}
.empty{padding:12px 0 6px;text-align:center;color:var(--muted);font-family:var(--ui);font-size:13px}

/* input row: every control is centred on the line of the current digit (20px above it, 32px tall) */
.input{align-items:start;padding-top:2px}
.input>.c{flex-direction:column;justify-content:flex-start;gap:2px;min-height:0}
.dial{width:32px;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize}
.dv{width:30px;text-align:center}
.dv.side{height:20px;line-height:20px;font-size:13px;color:var(--muted)}
.dv.cur{height:32px;line-height:32px;font-size:23px;font-weight:600}
.dv.m1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:1.5px}
.dv.m2{box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:50%}
.dial.locked{cursor:default}
.dial.locked .side{visibility:hidden}
.dial.locked .cur{color:var(--accent)}
.lock{width:32px;height:24px;display:grid;place-items:center;padding:0;color:var(--muted)}
.lock.on{color:var(--accent)}
.lock svg{width:14px;height:14px}
.input>.c.tickwrap{padding-top:24px}
.box{width:24px;height:24px;border:1px solid var(--ink);border-radius:3px;background:var(--paper);font-family:var(--ui);font-size:14px;font-weight:600;padding:0;line-height:1;color:var(--accent-ink)}
.box.on,.box.pending{background:var(--accent);border-color:var(--accent)}
.tickwrap .r{line-height:24px}
.input>.c.acts{padding:20px 0 0 8px;gap:8px;align-items:stretch;font-family:var(--ui)}
.acts button{font-size:12.5px;font-weight:600;line-height:1.15}
.acts .go{background:var(--accent);color:var(--accent-ink);border-radius:5px;height:32px;padding:0}
.acts .know{color:var(--accent);padding:2px 0}
.acts button:disabled{opacity:.3;cursor:not-allowed}

.status{min-height:1.4em;margin:0;font-size:13.5px;color:var(--muted)}
.status.bad{color:var(--false)}

.sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.digits{display:grid;grid-template-columns:repeat(3,32px);gap:2px}
.dh{text-align:center;font-family:var(--math);font-style:italic;font-weight:600;font-size:17px;height:28px}
.mark{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.digits .mark{height:32px;border-radius:50%;font-family:var(--math);font-size:18px;padding:0}
.mark.m1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:1.5px}
.mark.m2{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{margin:0}
.card h3{margin:0 0 3px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.letter{font-family:var(--math);font-style:italic;font-weight:600;font-size:19px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:2px 6px;margin-left:-9px}
.chip{border-radius:999px;padding:3px 9px;font-family:var(--math);font-size:15.5px;line-height:1.25;text-align:left}
.chip.match{background:var(--hl)}
.chip.nocard{color:var(--muted);font-style:italic}
.hint{margin:0;font-size:12.5px;color:var(--muted)}

.end{display:flex;flex-direction:column;gap:10px}
.end h2{margin:0;font-family:var(--math);font-style:italic;font-size:22px}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;font-variant-numeric:tabular-nums}
.stats div{display:flex;gap:6px} .stats dt{color:var(--muted)} .stats dd{margin:0;font-weight:600}
pre.out{margin:0;font-family:var(--math);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.endb{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:6px 14px;font-weight:600}

#modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal[hidden]{display:none}
.dlg{background:var(--paper);color:var(--ink);border-radius:8px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg p{margin:0;font-size:16px}
.dlg .math{font-family:var(--math);font-size:19px}
.dlg textarea{width:100%;height:190px;font-family:var(--math);font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--faint);border-radius:4px;padding:8px;resize:vertical}
.dlg small{color:var(--muted)}
.dlgb{display:flex;justify-content:flex-end;gap:18px;align-items:center}
@media (max-width:380px){ .row{grid-template-columns:repeat(3,minmax(26px,.9fr)) repeat(var(--n),minmax(24px,1fr)) 64px} .sheet{gap:14px} .digits{grid-template-columns:repeat(3,28px)} }
@media (prefers-reduced-motion:no-preference){ .box,.lock,.chip,.mark{transition:background-color .12s,box-shadow .12s,color .12s} }
</style>
</head>
<body>
<main id="app"></main>
<noscript><div class="nojs"><h1>Crack the Code!</h1><p><b>This game needs JavaScript, and it is turned off in this browser.</b></p><p>Everything runs on your own device: the page makes no network requests, and your games are saved only in this browser. Turn JavaScript on for this site, then reload the page.</p></div></noscript>
<div id="modal" hidden></div>
<script>
const FIXTURES = /*FIXTURES*/;
const LET = ['P','Q','R','S','T','U','V','W'], DIG = ['x','y','z'];
const T = '⊤', F = '⊥', DAG = '†', DOT = '·', TITLE = 'Crack the Code!';
const KEY = 'ctc-null-v1';
const app = document.getElementById('app'), modal = document.getElementById('modal');
let P, S;
const ui = { pending: false, msg: '', bad: false };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ix = c => (c[0] - 1) * 25 + (c[1] - 1) * 5 + (c[2] - 1);
const cs = c => c.join('');
const optTrue = (i, k, c) => P.preds[i].options[k].t[ix(c)] === '1';
const predVal = (i, c) => P.preds[i].active.some(k => optTrue(i, k, c));
const allLocked = () => S.locks.every(Boolean);
const plural = (n, w, pl) => n + ' ' + (n === 1 ? w : (pl || w + 's'));

function save() { try { localStorage.setItem(KEY + ':' + S.fid, JSON.stringify(S)); localStorage.setItem(KEY + ':last', S.fid); } catch (e) {} }
function load(fid) { try { const s = JSON.parse(localStorage.getItem(KEY + ':' + fid) || 'null'); if (s && s.v === 1 && s.fid === fid) return s; } catch (e) {} return null; }
function lastFid() { try { return localStorage.getItem(KEY + ':last'); } catch (e) { return null; } }
function fresh(p) {
  return { v: 1, fid: p.id, startedAt: Date.now(), finishedAt: null, dial: [1, 1, 1], locks: [false, false, false], ticks: [], rows: [],
    marks: { d: [0, 1, 2].map(() => [0, 0, 0, 0, 0]), o: p.preds.map(q => q.options.map(() => 0)) }, turns: 0, evals: 0, wrong: 0, contra: [], won: false };
}
function openGame(fid, forceNew, given) {
  P = FIXTURES.find(f => f.id === fid) || FIXTURES[0];
  S = (given && given.fid === P.id && given.v === 1) ? given : ((!forceNew && load(P.id)) || fresh(P));
  ui.msg = ''; ui.bad = false; ui.pending = false; save(); render();
}

// results this exact code already has, from earlier rows
function known(c) { const m = {}, key = cs(c); S.rows.forEach((r, ri) => { if (cs(r.code) === key) for (const i in r.res) if (!(i in m)) m[i] = { val: r.res[i], row: ri }; }); return m; }
function effTicks() { const t = S.ticks.slice().sort((a, b) => a - b); if (!allLocked()) return t; const k = known(S.dial); return t.filter(i => !(i in k)); }
// option outlined when the locked digits alone already make it true
function determined(i, k) {
  if (!S.locks.some(Boolean)) return false;
  const rng = d => S.locks[d] ? [S.dial[d]] : [1, 2, 3, 4, 5];
  for (const x of rng(0)) for (const y of rng(1)) for (const z of rng(2)) if (!optTrue(i, k, [x, y, z])) return false;
  return true;
}
// earlier cells that rule the guess out on their own (public information only)
function contraCells(g) {
  const out = [];
  S.rows.forEach((r, ri) => { for (const key in r.res) {
    const i = +key, val = r.res[key], opts = P.preds[i].options.map((o, k) => k).filter(k => P.preds[i].options[k].c !== null);
    let bad;
    if (P.singleOption) bad = !opts.some(k => optTrue(i, k, r.code) === val && optTrue(i, k, g));
    else { const go = opts.filter(k => optTrue(i, k, g)); bad = val ? go.length === 0 : go.every(k => optTrue(i, k, r.code)); }
    if (bad) out.push(ri + ':' + i);
  } });
  return out;
}

function fmtStart(ms) { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function fmtDur(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function headLines(withTime) {
  return [TITLE + ' #' + P.id + (withTime ? ' ' + fmtStart(S.startedAt) : ''), 'Predicates ' + P.preds.map(p => p.id).join(' '), 'Checker ' + P.preds.map(p => p.checker).join(' ')];
}
function shareText() {
  let line = '';
  for (const r of S.rows) {
    const keys = Object.keys(r.res).map(Number).sort((a, b) => a - b);
    if (!r.guess) line += keys.map(i => r.res[i] ? T : F).join('');
    else if (keys.every(i => r.res[i])) line += ' ' + DAG + T.repeat(P.preds.length);
    else line += ' ' + DAG + r.fresh.map(i => r.res[i] ? T : F).join('');
  }
  return headLines(false).concat([line.trim(), plural(S.turns, 'turn') + ', ' + plural(S.evals, 'evaluation') + ', ' + plural(S.wrong, 'wrong guess', 'wrong guesses')]).join('\n');
}
function exportText() {
  const n = P.preds.length, rows = S.rows.map(r => (cs(r.code) + (r.guess ? DAG : ' ')) + ' ' + Array.from({ length: n }, (_, i) => i in r.res ? (r.res[i] ? T : F) : DOT).join(' '));
  return headLines(true).concat(['xyz  ' + LET.slice(0, n).join(' ')], rows).join('\n');
}

const LOCK_ON = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const LOCK_OFF = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 7V5a3 3 0 0 1 5.6-1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

function render() {
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  const n = P.preds.length, locked = allLocked(), kn = locked ? known(S.dial) : {}, eff = effTicks();
  const echo = new Set(Object.keys(kn).map(i => kn[i].row + ':' + i)), contra = new Set(S.contra);
  const canEval = !S.won && locked && eff.length >= 1 && eff.length <= 3, canKnow = !S.won && locked && eff.length === 0;
  let h = '';
  h += '<header class="top"><h1>' + TITLE + '</h1><div class="tools"><button class="ghost" data-act="export" data-fk="export">Export table</button><button class="ghost" data-act="restart" data-fk="restart">Restart</button></div>';
  h += '<div class="meta"><label for="fx">Game</label><select id="fx" data-fk="fx">' + FIXTURES.map(f => '<option value="' + f.id + '"' + (f.id === P.id ? ' selected' : '') + '>#' + f.id + ' · ' + f.preds.length + ' predicates</option>').join('') + '</select>';
  h += '<span>' + fmtStart(S.startedAt) + '</span><span>' + (S.won ? 'Turns <b>' + S.turns + '</b>' : 'Turn <b>' + (S.turns + 1) + '</b>') + '</span><span>Evaluations <b>' + S.evals + '</b></span></div></header>';

  h += '<section class="board" style="--n:' + n + '" aria-label="Truth table">';
  h += '<div class="row head">' + DIG.map(d => '<span class="c">' + d + '</span>').join('') + LET.slice(0, n).map(l => '<span class="c">' + l + '</span>').join('') + '<span class="c"></span></div>';
  if (!S.rows.length) h += '<div class="empty">No evaluations yet. Set a code in the row below.</div>';
  S.rows.forEach((r, ri) => {
    h += '<div class="row hist' + (r.guess ? ' guess' : '') + '">';
    r.code.forEach((v, d) => { h += '<span class="c d">' + v + (d === 2 && r.guess ? '<span class="dag" title="guess">' + DAG + '</span>' : '') + '</span>'; });
    for (let i = 0; i < n; i++) {
      if (i in r.res) { const id = ri + ':' + i; h += '<span class="c"><span class="r ' + (r.res[i] ? 't' : 'f') + (echo.has(id) ? ' echo' : '') + (contra.has(id) ? ' contra' : '') + '">' + (r.res[i] ? T : F) + '</span></span>'; }
      else h += '<span class="c"></span>';
    }
    h += '<span class="c"></span></div>';
  });
  if (!S.won) {
    h += '<div class="row input">';
    for (let d = 0; d < 3; d++) {
      const v = S.dial[d], pv = (v + 3) % 5 + 1, nv = v % 5 + 1, mk = x => ' m' + S.marks.d[d][x - 1];
      h += '<div class="c"><div class="dial' + (S.locks[d] ? ' locked' : '') + '" data-dial="' + d + '" role="spinbutton" tabindex="0" aria-label="digit ' + DIG[d] + '" aria-valuemin="1" aria-valuemax="5" aria-valuenow="' + v + '" data-fk="dial' + d + '">';
      h += '<span class="dv side' + mk(pv) + '" data-dir="-1">' + pv + '</span><span class="dv cur' + mk(v) + '">' + v + '</span><span class="dv side' + mk(nv) + '" data-dir="1">' + nv + '</span></div>';
      h += '<button class="lock' + (S.locks[d] ? ' on' : '') + '" data-act="lock" data-d="' + d + '" aria-pressed="' + S.locks[d] + '" aria-label="lock ' + DIG[d] + '" data-fk="lock' + d + '">' + (S.locks[d] ? LOCK_ON : LOCK_OFF) + '</button></div>';
    }
    for (let i = 0; i < n; i++) {
      h += '<div class="c tickwrap">';
      if (i in kn) h += '<span class="r echo ' + (kn[i].val ? 't' : 'f') + '" title="already evaluated on this code">' + (kn[i].val ? T : F) + '</span>';
      else { const on = S.ticks.includes(i); h += '<button class="box' + (ui.pending ? ' pending' : on ? ' on' : '') + '" data-act="tick" data-i="' + i + '" aria-pressed="' + (on || ui.pending) + '" aria-label="evaluate ' + LET[i] + '" data-fk="tick' + i + '">' + (on || ui.pending ? '✓' : '') + '</button>'; }
      h += '</div>';
    }
    h += '<div class="c acts"><button class="go" data-act="eval" data-fk="eval"' + (canEval ? '' : ' disabled') + '>Evaluate</button><button class="know" data-act="know" data-fk="know" title="I Know The Answer"' + (canKnow ? '' : ' disabled') + '>I know the answer</button></div></div>';
  }
  h += '</section>';
  h += '<p class="status' + (ui.bad ? ' bad' : '') + '" role="status">' + esc(ui.msg) + '</p>';

  if (S.won) {
    const win = S.rows[S.rows.length - 1];
    h += '<section class="end"><h2>' + cs(win.code) + ' is the code.</h2><dl class="stats"><div><dt>Turns</dt><dd>' + S.turns + '</dd></div><div><dt>Evaluations</dt><dd>' + S.evals + '</dd></div><div><dt>Wrong guesses</dt><dd>' + S.wrong + '</dd></div><div><dt>Time</dt><dd>' + fmtDur(S.finishedAt - S.startedAt) + '</dd></div></dl>';
    h += '<pre class="out" id="shareout">' + esc(shareText()) + '</pre><div class="endb"><button class="primary" data-act="copyshare" data-fk="copyshare">Copy summary</button><button class="ghost" data-act="export" data-fk="export2">Export table (spoiler)</button><button class="ghost" data-act="again" data-fk="again">Play again</button></div></section>';
  }

  h += '<section class="sheet"><div class="digits" role="group" aria-label="Digit worksheet">' + DIG.map(d => '<span class="dh">' + d + '</span>').join('');
  for (let v = 1; v <= 5; v++) for (let d = 0; d < 3; d++) h += '<button class="mark m' + S.marks.d[d][v - 1] + '" data-mark="d:' + d + ':' + (v - 1) + '" data-fk="md' + d + v + '" aria-label="' + DIG[d] + ' ' + v + '">' + v + '</button>';
  h += '</div><div class="cards">';
  P.preds.forEach((p, i) => {
    h += '<article class="card"><h3><span class="letter">' + LET[i] + '</span><span>' + esc(p.text) + '</span></h3><div class="chips">';
    p.options.forEach((o, k) => { h += '<button class="chip mark m' + S.marks.o[i][k] + (determined(i, k) ? ' match' : '') + (o.c === null ? ' nocard' : '') + '" data-mark="o:' + i + ':' + k + '" data-fk="mo' + i + '_' + k + '"' + (o.c === null ? ' title="listed, but never the active option"' : '') + '>' + esc(o.l) + '</button>'; });
    h += '</div></article>';
  });
  h += '</div></section><p class="hint">Tap to cross out. Press and hold (or right-click) to circle. Blue shows the case your locked digits fall under. The game never changes your marks.</p>';
  app.innerHTML = h;
  if (fk) { const el = app.querySelector('[data-fk="' + fk + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}

function closeModal() { modal.hidden = true; modal.innerHTML = ''; modal.onclick = null; }
function ask(html, ok) {
  return new Promise(res => {
    modal.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><p>' + html + '</p><div class="dlgb"><button class="ghost" data-m="0">Cancel</button><button class="primary" data-m="1">' + esc(ok) + '</button></div></div>';
    modal.hidden = false;
    const done = v => { document.removeEventListener('keydown', key); closeModal(); res(v); };
    const key = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', key);
    modal.onclick = e => { const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m === '1'); else if (e.target === modal) done(false); };
    modal.querySelector('.primary').focus();
  });
}
function showText(title, text, note) {
  modal.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><p>' + esc(title) + '</p><textarea id="txtout" readonly></textarea><small id="txtnote">' + esc(note || '') + '</small><div class="dlgb"><button class="ghost" data-m="0">Close</button><button class="primary" data-m="1">Copy</button></div></div>';
  modal.querySelector('textarea').value = text; modal.hidden = false;
  modal.onclick = e => { const b = e.target.closest('[data-m]'); if (b && b.dataset.m === '1') copy(text, modal.querySelector('#txtnote'), modal.querySelector('textarea')); else if (b || e.target === modal) closeModal(); };
  modal.querySelector('.primary').focus();
}
function copy(text, noteEl, area) {
  const fail = () => { if (area) { area.focus(); area.select(); } if (noteEl) noteEl.textContent = 'Copying is blocked here. The text is selected; copy it by hand.'; };
  try { navigator.clipboard.writeText(text).then(() => { if (noteEl) noteEl.textContent = 'Copied.'; }, fail); } catch (e) { fail(); }
}
function say(msg, bad) { ui.msg = msg; ui.bad = !!bad; }

async function doEvaluate() {
  const t = effTicks(); if (S.won || !allLocked() || !t.length || t.length > 3) return;
  const kn = known(S.dial), room = Math.min(3, P.preds.length - Object.keys(kn).length), code = S.dial.slice();
  if (t.length < room && !(await ask('Only ' + t.length + ' of 3 evaluations selected. Continue?', 'Continue'))) return;
  const name = t.map(i => LET[i]).join('') + '(' + cs(code) + ')';
  if (!(await ask('Evaluate <span class="math">' + name + '</span>?', 'Evaluate'))) return;
  const res = {}; t.forEach(i => { res[i] = predVal(i, code); });
  S.rows.push({ code, res, guess: false, fresh: t });
  S.turns += 1; S.evals += t.length; S.contra = []; S.locks = [false, false, false]; S.ticks = [];
  say(name + ' = ' + t.map(i => res[i] ? T : F).join(''));
  save(); render();
}
async function doKnow() {
  if (S.won || !allLocked() || effTicks().length) return;
  const code = S.dial.slice();
  ui.pending = true; render();
  const ok = await ask('Guess <span class="math">' + cs(code) + '</span> as the final code?', 'Guess');
  ui.pending = false;
  if (!ok) { render(); return; }
  const kn = known(code), res = {}, fresh = [];
  P.preds.forEach((p, i) => { if (i in kn) res[i] = kn[i].val; else { res[i] = predVal(i, code); fresh.push(i); } });
  const win = P.preds.every((p, i) => res[i]);
  const contra = win ? [] : contraCells(code);
  S.rows.push({ code, res, guess: true, fresh });
  S.locks = [false, false, false]; S.ticks = [];
  if (win) { S.won = true; S.finishedAt = Date.now(); S.contra = []; say(''); }
  else {
    S.wrong += 1; S.evals += fresh.length; S.turns += Math.ceil(fresh.length / 3); S.contra = contra;
    say(cs(code) + ' is not the code.' + (contra.length ? ' ' + plural(contra.length, 'earlier cell') + ' already ruled it out.' : ''), true);
  }
  save(); render();
}
function toggleMark(key, s) { const [ty, a, b] = key.split(':'), arr = ty === 'd' ? S.marks.d[+a] : S.marks.o[+a]; arr[+b] = arr[+b] === s ? 0 : s; save(); render(); }
function step(d, dir) { if (S.won || S.locks[d]) return; S.dial[d] = ((S.dial[d] - 1 + dir + 5) % 5) + 1; save(); render(); }

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'lock') { if (S.won) return; const d = +b.dataset.d; S.locks[d] = !S.locks[d]; save(); render(); }
  else if (a === 'tick') { const i = +b.dataset.i, at = S.ticks.indexOf(i); if (at >= 0) S.ticks.splice(at, 1); else if (effTicks().length >= 3) say('Three predicates at most per turn.', true); else { S.ticks.push(i); if (ui.bad) say(''); } save(); render(); }
  else if (a === 'eval') doEvaluate();
  else if (a === 'know') doKnow();
  else if (a === 'export') showText('Truth table. Spoiler: it contains every code you tried.', exportText(), '');
  else if (a === 'copyshare') { const note = { set textContent(v) { say(v === 'Copied.' ? 'Summary copied.' : 'Copying is blocked here. Select the summary text and copy it by hand.'); render(); } }; copy(shareText(), note, null); }
  else if (a === 'restart') { if (await ask('Restart this puzzle? Your table and marks will be cleared.', 'Restart')) openGame(P.id, true); }
  else if (a === 'again') openGame(P.id, true);
});
app.addEventListener('change', e => { if (e.target.id === 'fx') openGame(e.target.value, false); });
app.addEventListener('keydown', e => {
  const mk = e.target.closest('[data-mark]'), dl = e.target.closest('.dial');
  if (mk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleMark(mk.dataset.mark, e.shiftKey ? 2 : 1); }
  else if (dl && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); step(+dl.dataset.dial, e.key === 'ArrowUp' ? 1 : -1); }
});
let drag = null, press = null;
app.addEventListener('pointerdown', e => {
  if (e.button) return;
  const dl = e.target.closest('.dial');
  if (dl) { const side = e.target.closest('[data-dir]'); drag = { d: +dl.dataset.dial, y: e.clientY, moved: false, dir: side ? +side.dataset.dir : 0 }; e.preventDefault(); return; }
  const mk = e.target.closest('[data-mark]');
  if (mk) { const key = mk.dataset.mark; press = { key, x: e.clientX, y: e.clientY, done: false, timer: setTimeout(() => { if (press && press.key === key) { press.done = true; toggleMark(key, 2); } }, 450) }; }
});
window.addEventListener('pointermove', e => {
  if (drag) { const dy = e.clientY - drag.y; if (Math.abs(dy) >= 16) { drag.moved = true; step(drag.d, dy < 0 ? 1 : -1); drag.y = e.clientY; } }
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
});
window.addEventListener('pointerup', () => {
  if (drag) { if (!drag.moved && drag.dir) step(drag.d, drag.dir); drag = null; }
  if (press) { clearTimeout(press.timer); if (!press.done) toggleMark(press.key, 1); press = null; }
});
window.addEventListener('pointercancel', () => { drag = null; if (press) { clearTimeout(press.timer); press = null; } });
app.addEventListener('contextmenu', e => {
  const mk = e.target.closest('[data-mark]'); if (!mk) return; e.preventDefault();
  if (press) { if (!press.done) { clearTimeout(press.timer); press.done = true; toggleMark(mk.dataset.mark, 2); } }
  else toggleMark(mk.dataset.mark, 2);
});
app.addEventListener('wheel', e => { const dl = e.target.closest('.dial'); if (dl) { e.preventDefault(); step(+dl.dataset.dial, e.deltaY > 0 ? 1 : -1); } }, { passive: false });

function start(data) { const given = data && data.S ? data.S : null; openGame(given ? given.fid : (lastFid() || FIXTURES[0].id), false, given); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
</script>
