<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crack the Code!</title>
<link rel="icon" id="ico-svg" href="favicon.svg" type="image/svg+xml">
<link rel="icon" id="ico-ico" href="favicon.ico" sizes="16x16 32x32">
<link rel="apple-touch-icon" id="ico-apple" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Crack the Code!">
<meta name="theme-color" content="#ffffff">
<style>
/* Layout idea: a bare white page from a logic workbook. Ink, two hairlines, and blue only where the game is pointing at something. */
:root{
  --paper:#ffffff; --ink:#111418; --muted:#646c78; --faint:#cfd4db; --zone:#f1f4f9; --ctl:#e6eaf0;
  --accent:#1d4ed8; --accent-ink:#ffffff; --hl:#d9e5ff; --true:#0b6e55; --false:#b02a1f; --contra:#fde3df; --gone:#9aa1ac;
  --math:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",Times,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1216; --ink:#e9edf2; --muted:#98a1ad; --faint:#39414c; --zone:#181d25; --ctl:#2a323d;
    --accent:#8fb0ff; --accent-ink:#0f1216; --hl:#1e3465; --true:#57d3ab; --false:#ff8f84; --contra:#4a211d; --gone:#59616c; color-scheme:dark;
  }
}
:root[data-theme="black"]{
  /* near-black, not #000: every pixel stays slightly lit, which avoids smearing on OLED screens while scrolling */
  --paper:#0b0b0c; --ink:#ededed; --muted:#8d9299; --faint:#2c2e32; --zone:#161719; --ctl:#26282c;
  --accent:#8fb0ff; --accent-ink:#0b0b0c; --hl:#192849; --true:#57d3ab; --false:#ff8f84; --contra:#3d1814; --gone:#585c63; color-scheme:dark;
}
:root[data-theme="dark"]{
  --paper:#0f1216; --ink:#e9edf2; --muted:#98a1ad; --faint:#39414c; --zone:#181d25; --ctl:#2a323d;
  --accent:#8fb0ff; --accent-ink:#0f1216; --hl:#1e3465; --true:#57d3ab; --false:#ff8f84; --contra:#4a211d; --gone:#59616c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:18px 16px 48px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.top h1{font-family:var(--math);font-style:italic;font-weight:600;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;align-items:center;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.meta select{background:var(--paper);border:none;padding:0;color:var(--ink)}
.tools{display:flex;gap:14px;margin-left:auto}
.ghost{padding:2px 0;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--accent)}

.board{font-family:var(--math);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(3,minmax(28px,.9fr)) repeat(var(--n),minmax(28px,1fr)) 74px;align-items:center}
.row>.c{text-align:center;min-height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.row>.c:nth-child(3){border-right:1px solid var(--ink)}
.head{border-bottom:1px solid var(--ink)}
.head .c{font-style:italic;font-weight:600;font-size:17px}
.hist.guess .c.d{font-weight:600}
.dag{position:absolute;right:1px;top:2px;font-size:13px;color:var(--muted)}
.r{font-weight:600;font-size:19px;border-radius:4px;padding:0 6px;line-height:1.35}
.r.t{color:var(--true)} .r.f{color:var(--false)}
.r.echo{background:var(--hl)}
.r.contra{background:var(--contra)}
.empty{padding:12px 0 6px;text-align:center;color:var(--muted);font-family:var(--ui);font-size:13px}

/* input row: every control is centred on the line of the current digit (20px above it, 32px tall) */
.input{align-items:start;padding-top:2px}
.input>.c{flex-direction:column;justify-content:flex-start;gap:2px;min-height:0}
.stepper{width:32px;display:flex;flex-direction:column;align-items:center}
.pm{width:32px;height:20px;line-height:18px;padding:0;font-family:var(--ui);font-size:15px;color:var(--muted)}
.pm:hover{color:var(--accent)}
.dv{width:30px;text-align:center}
.dv.cur{height:32px;line-height:32px;font-size:23px;font-weight:600}
.dv.m1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:1.5px}
.dv.m2{box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:50%}
.input>.c.tickwrap{padding-top:24px}
.box{width:24px;height:24px;border:1px solid var(--ink);border-radius:3px;background:var(--paper);font-family:var(--ui);font-size:14px;font-weight:600;padding:0;line-height:1;color:var(--accent-ink)}
.box.on,.box.pending{background:var(--accent);border-color:var(--accent)}
.tickwrap .r{line-height:24px}
.input>.c.acts{padding:20px 0 0 8px;gap:8px;align-items:stretch;font-family:var(--ui)}
.acts button{font-size:12.5px;font-weight:600;line-height:1.15}
.acts .go{background:var(--accent);color:var(--accent-ink);border-radius:5px;height:32px;padding:0}
.acts .know{color:var(--accent);padding:2px 0}
.acts button:disabled{opacity:.3;cursor:not-allowed}

.status{min-height:1.4em;margin:0;font-size:13.5px;color:var(--muted)}
.status.bad{color:var(--false)}

.sheet{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.digits{display:grid;grid-template-columns:repeat(3,32px);gap:2px}
.dh{text-align:center;font-family:var(--math);font-style:italic;font-weight:600;font-size:17px;height:28px}
.mark{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.digits .mark{height:32px;border-radius:50%;font-family:var(--math);font-size:18px;padding:0}
.mark.m1{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:1.5px}
.mark.m2{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{margin:0}
.card h3{margin:0 0 3px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.letter{font-family:var(--math);font-style:italic;font-weight:600;font-size:19px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:2px 6px;margin-left:-9px}
.chip{border-radius:999px;padding:3px 9px;font-family:var(--math);font-size:15.5px;line-height:1.25;text-align:left}
.chip.match{background:var(--hl)}
.chip.nocard{color:var(--muted);font-style:italic}
.hint{margin:0;font-size:12.5px;color:var(--muted)}

.end{display:flex;flex-direction:column;gap:10px}
.end h2{margin:0;font-family:var(--math);font-style:italic;font-size:22px}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;font-variant-numeric:tabular-nums}
.stats div{display:flex;gap:6px} .stats dt{color:var(--muted)} .stats dd{margin:0;font-weight:600}
pre.out{margin:0;font-family:var(--math);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.endb{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:6px 14px;font-weight:600}

#modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal[hidden]{display:none}
.dlg{background:var(--paper);color:var(--ink);border-radius:8px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px}
.dlg p{margin:0;font-size:16px}
.dlg .math{font-family:var(--math);font-size:19px}
.dlg textarea{width:100%;height:190px;font-family:var(--math);font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--faint);border-radius:4px;padding:8px;resize:vertical}
.dlg small{color:var(--muted)}
.dlgb{display:flex;justify-content:flex-end;gap:18px;align-items:center}
@media (max-width:380px){ .row{grid-template-columns:repeat(3,minmax(26px,.9fr)) repeat(var(--n),minmax(24px,1fr)) 64px} .sheet{gap:14px} .digits{grid-template-columns:repeat(3,28px)} }
@media (prefers-reduced-motion:no-preference){ .box,.chip,.mark{transition:background-color .12s,box-shadow .12s,color .12s} }
.setup{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;font-size:15px}
.bankrow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.bankrow select{background:var(--paper);color:var(--ink);border:none;border-bottom:1px solid var(--ink);padding:2px 0;max-width:100%}
.srow{display:grid;grid-template-columns:22px 92px 92px auto;gap:2px 12px;align-items:baseline}
.srow input{font:inherit;font-family:var(--math);font-size:18px;color:var(--ink);background:var(--paper);border:none;border-bottom:1px solid var(--ink);padding:2px 0;width:100%;border-radius:0;font-variant-numeric:tabular-nums}
.srow input::placeholder{color:var(--faint);font-family:var(--ui);font-size:13px}
.srow .ghost{justify-self:start}
.res{grid-column:2 / -1;font-size:13px;color:var(--muted);min-height:1.2em}
.res.bad{color:var(--false)}
.rep{margin:0}
.verdict{margin:0;font-family:var(--math);font-size:18px;font-style:italic}
.opt{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.opt input{accent-color:var(--accent);margin:0;width:15px;height:15px}
.setup h2{margin:10px 0 0;font-family:var(--math);font-style:italic;font-weight:600;font-size:18px}
.field{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:baseline}
.field label{font-size:14px;color:var(--muted)}
.field input{font:inherit;font-family:var(--math);font-size:19px;letter-spacing:.04em;color:var(--ink);background:var(--paper);border:none;border-bottom:1px solid var(--ink);padding:2px 0;width:100%;border-radius:0}
.field input::placeholder{color:var(--faint);font-family:var(--ui);font-size:13px;letter-spacing:0}
.field .res{grid-column:2}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{align-items:flex-start}
.opt input{margin-top:2px;flex:none}
.opt b{color:var(--ink);font-weight:500}
.srow{grid-template-columns:22px 92px minmax(92px,150px) auto}
.bankrow select{width:100%}
.primary.big{font-size:16px;padding:9px 18px}
.muted{color:var(--muted)}
.dlg.tut{max-width:480px;max-height:86vh;padding:0;gap:0}
.tutbody{overflow-y:auto;padding:18px 18px 4px}
.tutbody h2{margin:0 0 8px;font-family:var(--math);font-style:italic;font-size:22px}
.tutbody p{margin:0 0 10px;font-size:14.5px;line-height:1.45}
.dlg.tut .dlgb{padding:10px 18px 14px}
.tools{flex-wrap:wrap;justify-content:flex-end;gap:4px 14px}
.gotd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted)}
.gotd input{font:inherit;color:var(--ink);background:var(--paper);border:none;border-bottom:1px solid var(--ink);padding:2px 0;border-radius:0;color-scheme:inherit}
.srow select{grid-column:2 / -1;width:100%;min-width:0;font:inherit;font-size:13px;background:var(--paper);color:var(--muted);border:none;padding:1px 0;text-overflow:ellipsis}
.sp{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-start}
.spchart{flex:1 1 250px;min-width:0;overflow-x:auto}
.spchart svg{display:block}
.spchart .ln{fill:none;stroke:var(--ink);stroke-width:1.2}
.spchart circle{fill:var(--ink)}
.spchart .pt{cursor:pointer}
.spchart .pt.on circle{fill:var(--accent)}
.spchart text{font-family:var(--math);text-anchor:middle;fill:var(--muted)}
.spchart .v{font-size:12px;fill:var(--ink)}
.spchart .t{font-size:10.5px}
.spchart .pt.on .t,.spchart .pt.on .v{fill:var(--accent)}
.spside{flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:8px}
.spnav{display:flex;gap:12px;align-items:baseline;font-size:13px;color:var(--muted)}
.spnav button:disabled{opacity:.3;cursor:default}
.spws{display:flex;gap:16px;align-items:flex-start}
.spgrid{display:grid;grid-template-columns:repeat(3,18px);font-family:var(--math);font-size:14px;line-height:18px;text-align:center;flex:none}
.spgrid i{font-style:normal}
.spgrid .h{font-style:italic;font-weight:600}
.spopts{display:flex;flex-direction:column;gap:1px;font-family:var(--math);font-size:13px;line-height:18px;min-width:0}
.spopts .letter{font-size:14px;margin-right:6px}
.spopts span{margin-right:9px;white-space:nowrap;display:inline-block}
.spopts .only{font-weight:600}
.sp .off{color:var(--gone);text-decoration:line-through}
.sp .off.new{color:var(--accent)}
.spwhy{font-size:13px}
.spwhy p{margin:0 0 3px;color:var(--muted)} .spwhy p b{color:var(--ink);font-family:var(--math);font-size:14.5px}
.spwhy ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}

/* Three roles, each with one look. Label: small capitals, names a thing. Button: a filled shape, does something now.
   Zone: a tinted tray with white keys, the places you work. Everything on bare white is the record. */
.lbl{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.lbl .note{text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;margin-left:6px}
.setup h2{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal;margin:8px 0 0}
.ghost{padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink);background:var(--ctl);border-radius:999px}
.ghost:hover{color:var(--accent)}
.ghost.big{font-size:16px;padding:9px 18px;border-radius:5px;font-weight:600}
.primary:disabled,.ghost:disabled{opacity:.35;cursor:not-allowed}
.tools{gap:6px;justify-content:flex-start;margin-left:0;width:100%}
.top{gap:8px 14px}
.meta{gap:4px 16px;font-size:14px}
.meta b{font-family:var(--math);font-size:15px}
.facts{display:flex;flex-direction:column;gap:1px}
.facts p{margin:0;font-size:13.5px}
.board>.lbl{margin-bottom:2px}
.zone{background:var(--zone);border-radius:10px;margin:6px -10px 0;padding:8px 10px 10px}
.zone>.lbl{display:block;margin-bottom:4px}
.zone.ws{margin-top:0;padding-bottom:14px}
.zone .pm{background:var(--paper);border-radius:6px;color:var(--ink);width:30px;height:22px;line-height:20px;font-weight:600}
.zone .stepper{gap:3px}
.zone .acts .know{background:var(--paper);border-radius:5px;padding:5px 2px}
.zone .digits .mark,.zone .chip{background:var(--paper)}
.zone .chip.match{background:var(--hl)}
.zone .chips{margin-left:0;gap:5px 6px}
.zone .digits{gap:4px}
.input>.c.tickwrap{padding-top:28px}
.input>.c.acts{padding-top:25px}
.opt{color:var(--ink)}
.opt .muted,.opt b+span{color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.field input,.gotd input,.srow input{background:var(--zone);padding:4px 8px;border-radius:5px 5px 0 0}
.bankrow select,.srow select{background:var(--zone);border-radius:5px;padding:5px 6px;color:var(--ink)}
.bankrow select{border-bottom:none}
.spnav{align-items:center}
.dlgb{gap:10px}
.hint{font-size:12.5px}
/* crossed out: the key leaves the tray (no white fill) and one line runs the width of where it was */
.zone .mark.m1,.zone .chip.mark.m1,.zone .digits .mark.m1{background:transparent;color:var(--muted);text-decoration:none;position:relative}
.zone .mark.m1::after{content:"";position:absolute;left:5px;right:5px;top:50%;border-top:1.5px solid var(--muted)}
.zone .chip.mark.m1.match{background:var(--hl)}
.zone.next{padding-top:2px}
.zone.next>.lbl{margin:8px 0 0}
.board>.head{margin-bottom:0}
.field.code{grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.field.code .primary{padding:6px 16px}
#report:empty,#report2:empty{display:none}
.start{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:stretch;margin-top:-6px}
.start>input,.start>select,.foldsel{font:inherit;font-size:15px;color:var(--ink);background:var(--zone);border:none;border-radius:6px;padding:8px 10px;min-width:0;width:100%;text-align:left;height:38px;color-scheme:inherit}
.start>#code{font-family:var(--math);font-size:18px;letter-spacing:.04em}
.start>#code::placeholder{font-family:var(--ui);font-size:13px;letter-spacing:0;color:var(--muted)}
.start>select{grid-column:1;font-size:13.5px}
.start>.primary{padding:0;height:38px}
.foldsel{cursor:pointer}
.foldsel:hover{color:var(--accent)}
#codemsg:empty{display:none}
.setup>.opts{margin-top:-4px}
.status:empty{display:none}
.zone.next{padding-bottom:8px}
.zone.ws{margin-top:2px}
.meta .rival b{font-family:var(--ui);font-size:13.5px;font-weight:600}
.nojs{max-width:34rem;margin:0 auto;padding:18px 16px;font-family:var(--ui);color:var(--ink);line-height:1.45}
.nojs h1{font-family:var(--math);font-style:italic;font-weight:600;font-size:26px;letter-spacing:.01em;margin:0 0 18px}
.nojs p{margin:0 0 10px}
.theme{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.theme>span{font-size:14px;margin-right:4px}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.start.recent{margin-top:0}
.recent+.recent{margin-top:6px}
.recinfo{background:var(--zone);border-radius:6px;padding:4px 10px;min-width:0;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted);line-height:1.25}
.recinfo .code{font-family:var(--math);font-size:15px;color:var(--ink);letter-spacing:.03em}
.start.recent>button{height:auto;min-height:38px}
.start.recent>.ghost{border-radius:5px;font-size:15px;font-weight:600}

/* Touch and access (Apple: 44pt hit areas; WCAG 2.2: 24 px minimum). Where a control must look small,
   an invisible margin of hit area surrounds it; gaps keep neighbouring hit areas from overlapping. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ghost,.primary{min-height:36px;position:relative}
.ghost::before,.primary::before{content:"";position:absolute;inset:-4px 0}
.tools{gap:8px 6px}
.endb{gap:10px 8px}
/* digit steppers: the key stays small, the button around it is 40 tall and as wide as its column */
.zone .stepper{gap:0;width:100%;max-width:44px}
.zone .pm{width:100%;height:40px;background:none;border-radius:0;position:relative;z-index:0;line-height:40px}
.zone .pm::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:26px;margin:-13px 0 0 -15px;background:var(--paper);border-radius:6px;z-index:-1}
.zone .dv.cur{height:30px;line-height:30px}
/* tick boxes: the box is drawn, the button fills its cell */
.box{width:100%;max-width:44px;height:44px;border:none;background:none;position:relative;z-index:0;color:var(--accent-ink)}
.box::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border:1px solid var(--ink);border-radius:3px;background:var(--paper);box-sizing:border-box;z-index:-1}
.box.on,.box.pending{background:none}
.box.on::after,.box.pending::after{background:var(--accent);border-color:var(--accent)}
.input>.c.tickwrap{padding-top:22px}
.tickwrap .r{line-height:24px;margin-top:10px}
.acts .go,.zone .acts .know{min-height:44px;height:auto}
.input>.c.acts{padding-top:22px}
/* worksheet: 40 px digit keys, taller option chips with room between rows */
.digits,.zone .digits{grid-template-columns:repeat(3,40px);gap:4px}
.digits .mark{height:40px;font-size:19px}
.zone .chips{gap:8px 6px}
.chip{min-height:36px;padding:5px 11px;position:relative}
.chip::before{content:"";position:absolute;inset:-4px 0}
@media (max-width:380px){ .digits,.zone .digits{grid-template-columns:repeat(3,36px)} .digits .mark{height:36px} }
/* aids: the whole line is the target */
.opt{min-height:44px;align-items:center;padding:4px 0}
.opt input{width:20px;height:20px;margin-top:0}
.start>input,.start>select,.foldsel,.start>.primary{height:44px}
/* messages keep a fixed line under the test row, so the worksheet never jumps */
.status.slot,.status.slot:empty{display:block;min-height:1.45em;margin:4px 0 0;font-size:13px}
/* not by colour alone: a contradicting cell is ringed, and marks new at a review step are ringed in blue */
.r.contra{box-shadow:0 0 0 2px var(--false)}
.sp .spgrid .new{box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:50%}
.sp .spopts .new{box-shadow:0 0 0 1.5px var(--accent);border-radius:4px;padding:0 3px}
.newbie{margin:-4px 0 0;font-size:15px}
.start>.big{height:44px;padding:0 18px;justify-self:start}
.firstp{align-self:center;color:var(--muted);font-size:14px}
/* install offer: one quiet line with Yes and No */
.install{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:14px;background:var(--zone);border-radius:8px;padding:8px 10px;margin:4px 0 2px}
.install span{flex:1 1 200px}
.install .primary{padding:0 16px}
.tutbody ol{padding-left:20px;margin:6px 0}
.tutbody li{margin:4px 0}
.fine{margin-top:28px;font-size:12px}
.quiet{background:none;border:none;padding:0;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* header: How to play, Hint and a menu for the rest */
.menuwrap{position:relative}
.ghost.more{min-width:44px;font-size:18px;line-height:1;letter-spacing:.05em}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;display:flex;flex-direction:column;min-width:190px;background:var(--paper);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18),0 0 0 1px var(--faint);padding:6px}
.menu button{font:inherit;font-size:15px;text-align:left;background:none;border:none;color:var(--ink);padding:0 12px;min-height:44px;border-radius:6px}
.menu button:hover,.menu button:focus-visible{background:var(--zone)}
.tools{flex-wrap:nowrap}
/* table letters and card letters jump to each other */
button.jump{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;min-width:28px;min-height:32px}
.card h3 button.letter{min-width:24px;min-height:28px;text-align:left}
@media (prefers-reduced-motion:no-preference){ .flash{animation:flash 1.1s ease-out} }
@media (prefers-reduced-motion:reduce){ .flash{outline:2px solid var(--accent);outline-offset:2px} }
@keyframes flash{0%{background:var(--hl);box-shadow:0 0 0 4px var(--hl)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.c.flash{border-radius:6px}
.card.flash{border-radius:8px}
/* review worksheet in the player's own look: white key = still possible; bare and struck = ruled out; blue strike = ruled out at this step; bold = only one left */
.sp .spws{background:var(--zone);border-radius:10px;padding:8px;gap:12px}
.sp .spgrid{grid-template-columns:repeat(3,26px);gap:3px;line-height:26px;font-size:15px}
.sp .spgrid i:not(.h){background:var(--paper);border-radius:50%;position:relative;color:var(--ink)}
.sp .spopts{gap:4px;font-size:13.5px}
.sp .spopts>div{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.sp .spopts span:not(.sr){background:var(--paper);border-radius:999px;padding:1px 8px;margin:0;position:relative;color:var(--ink)}
.sp .spgrid .off,.sp .spopts span.off{background:transparent!important;color:var(--gone);text-decoration:none}
.sp .spgrid .off::after,.sp .spopts span.off::after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.5px solid var(--gone)}
.sp .spgrid .off.new,.sp .spopts span.off.new{color:var(--accent)}
.sp .spgrid .off.new::after,.sp .spopts span.off.new::after{border-top:2px solid var(--accent)}
.sp .spgrid .new,.sp .spopts .new{box-shadow:none}
.sp .spopts span.only{font-weight:700}
/* end screen: the summary reads as the thing you will paste */
.end h2.sub{font-size:19px;margin-top:10px}
.end pre.out{background:var(--zone);border-radius:8px;padding:10px 12px;margin-top:-4px}
.card h3 button.letter.jump{font-family:var(--math);font-style:italic;font-weight:600;font-size:19px}
</style>

async function doEvaluate() {
  const t = effTicks(); if (S.won || !t.length || t.length > 3) return;
  const kn = known(S.dial), room = Math.min(3, P.preds.length - Object.keys(kn).length), code = S.dial.slice();
  if (t.length < room && !(await ask('Only ' + t.length + ' of 3 evaluations selected. Continue?', 'Continue'))) return;
  const name = t.map(i => LET[i]).join('') + '(' + cs(code) + ')';
  if (!(await ask('Evaluate <span class="math">' + name + '</span>?', 'Evaluate'))) return;
  const res = {}; t.forEach(i => { res[i] = predVal(i, code); });
  S.rows.push({ code, res, guess: false, fresh: t });
  S.turns += 1; S.evals += t.length; S.contra = []; S.ticks = []; ui.step = null; announce(name + ': ' + t.map(i => LET[i] + (res[i] ? ' true' : ' false')).join(', '));
  const anyF = t.some(i => !res[i]), anyT = t.some(i => res[i]);
  const tip = (anyF ? tipOnce('false', F_ + ' means the secret option is not one ' + cs(code) + ' satisfies: on that card, cross out every option ' + cs(code) + ' does satisfy. ') : '')
    + (anyT ? tipOnce('true', T + ' means ' + cs(code) + ' satisfies the secret option: on that card, cross out every option it does not satisfy' + (P.singleOption ? '' : ' (when the card has one secret option)') + '.') : '');

  ui.pending = false; if (!ok) { render(); return; }

  else if (id === 'gdate') form.gdate = e.target.value;

    const i = +e.target.dataset.sel; form.rows[i] = { p: e.target.value, k: '' }; syncFromRows(); document.getElementById('rows').innerHTML = rowsHtml();

    { const bk = document.getElementById('bank'); if (bk) bk.innerHTML = bankHtml(); } setReport(); { const fb = document.querySelector('[data-f="fmodes"]'); if (fb) fb.textContent = '\u25be ' + modesWord(); }
  }
  else if (id === 'bank' && e.target.value !== '') { const v = e.target.value; loadCode((v[0] === 't' ? TMBANK : BANK)[+v.slice(1)]); render(); }
  else if (id === 'code' && form.report && form.report.pz) { e.target.value = form.code; }
});
app.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.menu) { ui.menu = false; render(); const m = app.querySelector('[data-act="menu"]'); if (m) m.focus(); return; }
  const mk = e.target.closest('[data-mark]');
  if (mk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleMark(mk.dataset.mark, e.shiftKey ? 2 : 1); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.row !== undefined) { form.show = false; checkForm(); setReport(); }
});
let press = null;
app.addEventListener('pointerdown', e => {
  if (e.button) return;
  const mk = e.target.closest('[data-mark]');
  if (mk) { const key = mk.dataset.mark; press = { key, x: e.clientX, y: e.clientY, done: false, timer: setTimeout(() => { if (press && press.key === key) { press.done = true; toggleMark(key, 2); } }, 450) }; }
});
window.addEventListener('pointermove', e => { if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; } });

  const mk = e.target.closest('[data-mark]'); if (!mk) return; e.preventDefault();
  if (press) { if (!press.done) { clearTimeout(press.timer); press.done = true; toggleMark(mk.dataset.mark, 2); } }

// ---------- home screen: offline copy, install prompt, moving saved games ----------
// Only on the real site: the artifact preview neither installs nor works offline.
const SITE = /(^|\.)crackthe\.xyz$|\.github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const STANDALONE = (() => { try { return (!!window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; } catch (e) { return false; } })();
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), ANDROID = /Android/.test(navigator.userAgent);
const INSTALL_AFTER = 10;   // loads in the browser before the game offers the home screen
let installEvent = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; });
window.addEventListener('appinstalled', () => { LS.set('install-done', '1'); installEvent = null; if (view === 'setup') render(); });
if (SITE && !STANDALONE) LS.set('loads', String((+LS.get('loads') || 0) + 1));   // quiet when already running from the home screen
if (SITE && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const askInstall = () => SITE && (IOS || ANDROID) && !STANDALONE && (+LS.get('loads') || 0) >= INSTALL_AFTER && !LS.get('install-no') && !LS.get('install-yes') && !LS.get('install-done');
const MOVE_HEAD = TITLE + ' saved games';
function savesText() {   // every saved game and setting, as one block of text to paste into the home-screen copy
  const items = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(KEY + ':') && !/:(loads|install-)/.test(k)) items[k.slice(KEY.length + 1)] = localStorage.getItem(k); } } catch (e) {}
  return MOVE_HEAD + '\n' + btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, items })))).replace(/(.{64})/g, '$1\n').trim();
}
function loadSaves(text) {   // returns how many games were added, or -1 if the text is not a saved-games block
  const at = text.indexOf(MOVE_HEAD); if (at < 0) return -1;
  let d; try { d = JSON.parse(decodeURIComponent(escape(atob(text.slice(at + MOVE_HEAD.length).replace(/\s+/g, ''))))); } catch (e) { return -1; }
  if (!d || d.v !== 1 || !d.items) return -1;
  const before = new Set(recentIds());
  Object.keys(d.items).forEach(k => { if (k !== 'recent' && k !== 'last' && LS.get(k) === null) LS.set(k, d.items[k]); });
  let ids = []; try { ids = JSON.parse(d.items.recent || '[]'); } catch (e) {}
  const all = Array.from(new Set(recentIds().concat(ids))).map(readGame).filter(Boolean).sort((a, b) => b.startedAt - a.startedAt);
  all.slice(RECENT_MAX).forEach(s => LS.del('g:' + gameId(s)));
  const keep = all.slice(0, RECENT_MAX).map(gameId); LS.set('recent', JSON.stringify(keep));
  if (!LS.get('last') && d.items.last && readGame(d.items.last)) LS.set('last', d.items.last);
  return keep.filter(id => !before.has(id)).length;
}
function showInstall() {
  const games = recentGames().length;
  let body = '<h2>Add it to your home screen</h2>';
  if (IOS) {
    body += '<ol><li>In Safari, tap <b>Share</b> (the square with an arrow). On recent iPhones it may be inside the <b>\u2022\u2022\u2022</b> menu.</li><li>Choose <b>Add to Home Screen</b>. You may need to scroll down, or tap <b>More</b>.</li><li>Tap <b>Add</b>.</li></ol>'
      + '<p>The home-screen copy opens like an app, works offline, and its saved games are safe from Safari\u2019s seven-day clean-up.</p>'
      + '<p>It starts without your saved games: iPhone keeps them apart from Safari.' + (games ? ' To bring yours along, tap <b>Copy my games</b> now. In the new copy, tap <b>Paste a table or saved games</b> and paste.' : '') + '</p>';
  } else {
    body += installEvent ? '<p>Tap <b>Install</b> below, then confirm.</p>' : '<ol><li>Open your browser\u2019s menu (<b>\u22ee</b>).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm.</li></ol>';
    body += '<p>It opens like an app and works offline. In Chrome, your saved games come along.</p>';
  }
  modal.innerHTML = '<div class="dlg tut" role="dialog" aria-modal="true"><div class="tutbody">' + body + '</div><small id="txtnote"></small><div class="dlgb">'
    + (IOS && games ? '<button class="ghost" data-m="copy">Copy my games</button>' : '') + (!IOS && installEvent ? '<button class="ghost" data-m="0">Not now</button><button class="primary" data-m="inst">Install</button>' : '<button class="primary" data-m="0">Done</button>') + '</div></div>';
  modal.hidden = false;
  modal.onclick = async e => {
    const b = e.target.closest('[data-m]'); if (!b) { if (e.target === modal) { closeModal(); render(); } return; }
    if (b.dataset.m === 'copy') { copy(savesText(), modal.querySelector('#txtnote')); return; }
    if (b.dataset.m === 'inst' && installEvent) { const ev = installEvent; installEvent = null; try { await ev.prompt(); } catch (err) {} }
    closeModal(); render();
  };
  modal.querySelector('.primary, .ghost').focus();
}
async function checkUpdate(el) {   // reached only from the very end of How to play
  el.textContent = 'Checking\u2026';
  try {
    const r = await fetch('./?check=' + Date.now(), { cache: 'no-store' }), m = (await r.text()).match(/const BUILD = "([0-9a-f]{8})"/);
    if (!r.ok || !m) throw new Error('no build');
    if (m[1] === BUILD) { el.textContent = 'You have the latest version (' + BUILD + ').'; return; }
    el.textContent = 'Updating\u2026';
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    location.reload();
  } catch (e) { el.textContent = 'Could not reach the site. Try again when you are online.'; }
}

function start(data) {
  const given = data && data.S && data.S.v === 3 ? data.S : null, last = given || lastState();

}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));
